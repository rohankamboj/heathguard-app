version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: healthguard_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthguard_net
    restart: unless-stopped

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthguard_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/healthguard
    volumes:
      - ./backend:/app        # hot-reload in dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - healthguard_net
    restart: unless-stopped
    command: >
      sh -c "
        echo '⏳ Waiting for DB...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ── Seeder (not started by `up`; run via setup.sh or: docker compose run --rm seeder)
  seeder:
    profiles:
      - seed
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthguard_seeder
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/healthguard
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - healthguard_net
    command: python seed.py
    restart: "no"

  # ── Frontend (dev mode) ──────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: healthguard_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - healthguard_net
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  healthguard_net:
    driver: bridge
